name: Release tarball

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: dist/ngx-mat-timepicker
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/ngx-mat-timepicker-*.tgz --title "$GITHUB_REF_NAME" --notes "Angular 21 fork. Keeps the dial-control time localizer provider."
